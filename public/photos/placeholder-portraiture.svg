<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6EDF7"/>
      <stop offset="1" stop-color="#B6C6DD"/>
    </linearGradient>
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.25  0 0 0 0 0.4  0 0 0 0.35 0"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <rect width="800" height="1000" filter="url(#n)" opacity="0.22"/>
</svg>
